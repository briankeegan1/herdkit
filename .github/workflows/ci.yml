name: CI

# Cross-platform hermetic-suite gate (HERD-167).
#
# WSL2-FIRST POLICY (2026-07-08): the supported way to run herdkit on Windows is WSL2, not
# native Git Bash (bash/locale/python3 divergences make Git Bash too spotty to gate on — see
# docs/windows.md). WSL2 semantics ARE Linux semantics, so the `ubuntu` leg below IS the
# Windows/WSL2 coverage. Consequently:
#   • ubuntu + macOS   — run the hermetic suite; REQUIRED green. ubuntu doubles as WSL2.
#   • windows-latest   — a MINIMAL advisory smoke (scripts/ci/windows-smoke.sh): LF/.gitattributes
#                        + docs sanity + `bash -n`. NOT the full suite chasing Git Bash greens,
#                        and it does NOT spin up nested WSL inside the runner. Advisory only.
#
# The suite is HERMETIC (stubs claude/herdr/gh, no network). scripts/ci/run-suite.sh runs the SAME
# curated set the auto-merge watcher gates on (the tests/test-*.sh files tests/herd.bats wraps),
# but DIRECTLY — one `timeout N bash test.sh` per test — rather than via `bats`, which hangs on a
# headless leg when a hermetic test leaks a background process holding bats's FD 3 (see the runner's
# header). Known env-sensitive tests are marked XFAIL via tests/known-env-sensitive.tsv (never hacked
# green); any other failure — including a per-test timeout — is a real red.
#
# SHARDING (HERD-463): ~350 curated tests ran serially per platform (macos 24m, ubuntu 13m on PR
# #579) — the #1 operator pain after HERD-437/440/441 re-armed 168 previously-exempt tests.
# `shard` fans each platform out across N machines via a stable filename hash
# (scripts/herd/suite-shard.sh: HERD_CI_SHARD_INDEX of HERD_CI_SHARD_COUNT).
#
# RIGHT-SIZED TO THE RUNNER CAP (HERD-665, supersedes the HERD-493 8-shard call): this GitHub plan
# caps macOS-hosted-runner concurrency at 5 jobs ACCOUNT-WIDE (shared across every workflow run in
# every repo on the account, including a fleet PR burst racing this one) — confirmed against real
# runs (`gh run list`/`gh run view` job timestamps on pushes to main): 8 macOS shards never actually
# run 8-wide, they run a 5-then-3 DOUBLE WAVE, so shards 6-8 sit queued behind shards 1-5 regardless
# of the array size. The HERD-493 comment ("macOS benefits from more shards before per-runner spin-up
# eats the gain") predates that observation — it's true in isolation, but moot once the account cap
# caps the wave at 5 concurrent no matter how many shards the matrix declares. macos now ships 5
# shards (one wave, matching the cap exactly); ubuntu keeps 6 (its own concurrency tier is not the
# constraint, and 6 already sat at its own per-runner-overhead knee). See the PR body for the
# measured before/after wall-clock. The `shard:` array below (1..6) MUST cover the largest
# per-platform count (ubuntu's 6), with `exclude:` trimming it back to each platform's own count, and
# each platform's `shard_count` (used for HERD_CI_SHARD_COUNT) MUST match how many of its shard
# values survive the exclude — mutation-proven membership (every test lands in exactly one shard, the
# union == the full curated set, for every shard count this workflow ships) lives in
# tests/test-suite-shard.sh, not in this workflow. DOES NOT REDUCE what runs — only wall-clock.
#
# FLEET-BURST INTERPLAY: right-sizing macos to 5 removes the SELF-inflicted double wave (this run's
# own shards queuing behind each other), but the account-wide cap is still shared with every other
# concurrent macOS job on the account — a burst of several PRs' CI (or another repo's workflow) can
# still queue this run's 5 shards behind THEIR jobs the same way. Nothing in this workflow can fix
# that; it is an account-plan ceiling, not a per-workflow one. If fleet bursts become the dominant
# wait, the lever is the GitHub plan's concurrency tier, not this matrix.
#
# DIFF-SCOPING (HERD-664): sharding splits the SAME ~350 tests across boxes; scoping asks the
# different question of which of them a PR's diff can actually break. `HERD_CI_SCOPE_BASE_REF` below
# hands scripts/ci/run-suite.sh the PR's base branch; the runner diffs HEAD against its merge-base
# with that ref and scopes the curated set FIRST (scripts/herd/suite-shard.sh's
# herd_suite_tests_for_diff — name-pairing + `# suite-deps:` headers + the always-run
# tests/scope-core.tsv, and FAIL-CLOSED to the ENTIRE curated set on any wide-blast or unmappable
# path), then shards the SCOPED set, so a shard with no scoped tests exits green in seconds. The ref
# is passed ONLY for a pull_request: a push to main leaves it empty, which is byte-identical to the
# pre-HERD-664 full sharded run — as is every fail-closed path, including a diff this runner cannot
# obtain at all. `fetch-depth: 0` on a PR is what makes the merge base resolvable (the default
# shallow checkout has no common ancestor to find); if it were ever unavailable the runner falls back
# to the full set rather than guessing. Every run prints "scoped N of M curated tests (reason)" —
# there is no silent cap.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Deterministic terminal so tput-cols-driven rendering behaves the same on every leg (a runner
  # with no TERM makes `tput cols` diverge from the maintainer's box).
  TERM: xterm

jobs:
  suite:
    name: suite (${{ matrix.platform }}, shard ${{ matrix.shard }}/${{ matrix.shard_count }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, macos]
        shard: [1, 2, 3, 4, 5, 6]   # superset; exclude below trims per-platform
        exclude:
          # macos runs 5 shards (the account-wide macOS runner cap, HERD-665) — trim the 6th slot
          # ubuntu's larger fan-out needs.
          - platform: macos
            shard: 6
        include:
          - platform: ubuntu   # doubles as the WSL2 coverage (WSL2 == Linux semantics)
            os: ubuntu-latest
            locale: C.UTF-8         # glibc ships C.UTF-8
            shard_count: 6          # keep in sync with the `shard:` array's full range above
          - platform: macos
            os: macos-latest
            locale: en_US.UTF-8     # BSD libc has no C.UTF-8 — use a real UTF-8 locale
            shard_count: 5          # keep in sync with the `exclude:` block above (HERD-665: == the account-wide macOS runner cap)
    env:
      HERD_CI_PLATFORM: ${{ matrix.platform }}
      HERD_CI_SHARD_INDEX: ${{ matrix.shard }}
      HERD_CI_SHARD_COUNT: ${{ matrix.shard_count }}
      # HERD-664 diff-scoped selection: the PR's base branch, or EMPTY on a push to main (which runs
      # the full curated sharded set, exactly as before). Quoted string literals on purpose — an
      # unquoted `&& 0 || 1` would evaluate to 1, since 0 is falsy in a GitHub expression.
      HERD_CI_SCOPE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on a PR so `git merge-base <base> HEAD` resolves (HERD-664); a push to main
          # is not scoped, so it keeps the fast shallow checkout.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Fetch the PR base branch (diff-scoped selection, HERD-664)
        if: github.event_name == 'pull_request'
        run: |
          # Give the merge-base a NAMED ref to resolve. Best-effort: if this fetch fails, the runner
          # cannot obtain a diff and falls back to the FULL curated set — never to a guess.
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
      - name: Set up Python 3.12
        # The suite is tested against a mature Python; the runner default (3.14) regresses the
        # codemap + rich-render tests. Pin a stable version that matches the maintainer's engine.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: macOS — GNU coreutils/grep/sed/awk on PATH (match the maintainer's Homebrew env)
        if: runner.os == 'macOS'
        run: |
          # The suite assumes GNU tools (e.g. `grep -P` in test-native-burst, UTF-8-safe sed/awk in
          # backlog rendering) — present on the maintainer's macOS via Homebrew, absent from a clean
          # runner's BSD userland. Install them and put their gnubin dirs first on PATH.
          brew install grep gnu-sed gawk coreutils
          for p in grep gnu-sed gawk coreutils; do
            echo "$(brew --prefix)/opt/$p/libexec/gnubin" >> "$GITHUB_PATH"
          done
      - name: Configure git identity (runners ship none; hermetic tests commit)
        run: |
          git config --global user.name  "herdkit CI"
          git config --global user.email "ci@herdkit.local"
          git config --global init.defaultBranch main
      - name: Point the dogfood PROJECT_ROOT at the checkout
        run: |
          # .herd/config hardcodes PROJECT_ROOT="$HOME/source/herdkit" (the maintainer's layout).
          # A few tests run engine commands against the REAL repo (e.g. test-codemap-project's
          # "real repo maps as ENGINE") and read that config; on a runner the path doesn't exist, so
          # codemap picks the wrong root and mis-detects PROJECT mode. Make the path resolve here.
          mkdir -p "$HOME/source"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/source/herdkit"
      - name: Show environment
        run: |
          echo "platform: $HERD_CI_PLATFORM   uname: $(uname -a)"
          echo "bash: $BASH_VERSION   TERM: $TERM   cols: $(tput cols 2>/dev/null || echo n/a)   LC_ALL: $LC_ALL"
          python3 --version; command -v grep; grep --version | head -1
      - name: Run hermetic suite
        run: bash scripts/ci/run-suite.sh
      - name: Upload suite failure artifacts (logs + chaos/sim scorecards)
        # HERD-436: on a real failure, the per-test logs and any scorecard.json / per-rep detail a
        # sim/chaos test names in its own "see <dir>/scorecard.json" message previously lived only in
        # a runner tmpdir that was never uploaded — the single most useful diagnostic, discarded on
        # every run. run-suite.sh exports both dirs via $GITHUB_ENV; if-no-files-found stays "ignore"
        # since not every failure mode populates HERD_CI_ARTIFACTS_DIR (only --artifacts-capable tests do).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-failure-${{ matrix.platform }}-shard${{ matrix.shard }}
          path: |
            ${{ env.HERD_CI_LOGDIR }}
            ${{ env.HERD_CI_ARTIFACTS_DIR }}
          if-no-files-found: ignore
          retention-days: 14

  windows-smoke:
    # WSL2-first: Windows gets a fast ADVISORY smoke, not the full suite. continue-on-error so a
    # Git Bash quirk never blocks a merge — the ubuntu leg is the authoritative Windows/WSL2 gate.
    name: windows-smoke (advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows advisory smoke
        run: bash scripts/ci/windows-smoke.sh
